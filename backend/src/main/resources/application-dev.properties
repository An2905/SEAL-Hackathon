# Local development database and environment settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hackathon}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Load local environment configuration properties if present
spring.config.import=optional:file:.env.properties

# Local service configurations
brevo.api.key=${BREVO_API_KEY:}
recaptcha.secret=${RECAPTCHA_SECRET:}
github.client.id=${GITHUB_CLIENT_ID:}
github.client.secret=${GITHUB_CLIENT_SECRET:}
github.redirect.uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
github.frontend.redirect=${GITHUB_FRONTEND_REDIRECT:http://localhost:5173/student}

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
