name: Frontend CI

on:
  pull_request:
    branches:
      - Main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - Main
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Code
        run: |
          cd frontend
          npm run lint

      - name: Check Formatting
        run: |
          cd frontend
          npm run format:check

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
