spring.application.name=Hackathon

# Local development (default profile)
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hackathon}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.config.import=optional:file:.env.properties

brevo.api.key=${BREVO_API_KEY:}
recaptcha.secret=${RECAPTCHA_SECRET:}

# Force UTF-8 for HTTP request/response
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
