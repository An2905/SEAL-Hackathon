spring.application.name=Hackathon

# Activate default profile (local development)
spring.profiles.active=dev

# Server Port
server.port=8080

# Force UTF-8 for HTTP request/response
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

# GitHub App Configuration Mappings
github.app.client-id=${GITHUB_APP_CLIENT_ID:${GITHUB_CLIENT_ID:}}
github.app.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}
github.app.installation-id=${GITHUB_INSTALLATION_ID:}
github.app.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.app.organization=${GITHUB_ORGANIZATION:}
