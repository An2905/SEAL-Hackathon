name: Backend CI

on:
  pull_request:
    branches:
      - Main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - Main
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Backend
        run: |
          cd backend
          ./mvnw clean compile

      - name: Package Backend (Skip Tests)
        run: |
          cd backend
          ./mvnw package -DskipTests
