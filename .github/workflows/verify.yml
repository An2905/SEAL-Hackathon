name: Pull Request Verification

on:
  pull_request:
    branches:
      - Main
  workflow_dispatch:

jobs:
  verify:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Compile Check (Hook: auto-build-check)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Compile Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean compile -q
        # This will fail the build immediately if there are compilation errors

      # 2. Security Guards (Hooks: sql-injection-guard, hardcoded-secrets-guard)
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Security Guards Check
        run: python .github/scripts/security_check.py
