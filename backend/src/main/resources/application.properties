spring.application.name=Hackathon


spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Hackathon;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true

spring.datasource.username=sa
spring.datasource.password=12345

brevo.api.key = ${BREVO_API_KEY}

recaptcha.secret=${RECAPTCHA_SECRET}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.config.import=optional:file:.env.properties
# Force UTF-8 for HTTP request/response so Vietnamese (NVARCHAR) is not mojibake
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true