spring.application.name=Hackathon

# Local development (default profile)
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hackathon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.config.import=optional:file:.env.properties

brevo.api.key=${BREVO_API_KEY:}
recaptcha.secret=${RECAPTCHA_SECRET:}

# Force UTF-8 for HTTP request/response
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
