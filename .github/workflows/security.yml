name: Security Scan

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

jobs:
  security:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend Dependency Check (npm audit)
        run: |
          cd frontend
          npm audit || true
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend Dependency Check
        run: |
          cd backend
          ./mvnw dependency:analyze-only || true
        continue-on-error: true
